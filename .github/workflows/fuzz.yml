name: Fuzz

on:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'fuzz/**'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [header, terminfo, capabilities, mouse]
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@nightly
    - name: Install cargo-fuzz
      uses: taiki-e/install-action@cargo-fuzz
    - name: Collect terminfo seeds
      run: |
        mkdir -p fuzz/seeds/terminfo
        for name in xterm-256color xterm screen screen-256color tmux-256color linux vt100 vt220 rxvt-unicode dumb; do
          file=$(find /usr/share/terminfo /lib/terminfo -name "$name" 2>/dev/null | head -n 1)
          if [ -n "$file" ]; then cp "$file" "fuzz/seeds/terminfo/$name"; fi
        done
    - name: Restore corpus
      uses: actions/cache@v6
      with:
        path: fuzz/corpus/${{ matrix.target }}
        key: fuzz-${{ matrix.target }}-${{ github.run_id }}
        restore-keys: fuzz-${{ matrix.target }}-
    - name: Run fuzzer
      run: |
        mkdir -p "fuzz/corpus/${{ matrix.target }}"
        cargo fuzz run ${{ matrix.target }} "fuzz/corpus/${{ matrix.target }}" "fuzz/seeds/${{ matrix.target }}" -- -max_total_time=${{ github.event_name == 'pull_request' && 120 || 600 }} -rss_limit_mb=4096
    - name: Upload crash
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: crash-${{ matrix.target }}
        path: fuzz/artifacts/${{ matrix.target }}
